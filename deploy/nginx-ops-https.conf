# 证书签发后安装为宿主 Nginx 的 ops.conf。
# 首次上线先保留 max-age=300；确认 HTTPS、登录 Cookie 和续期正常后再按 https-setup.md 拉长。

gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_types application/javascript text/javascript text/css application/json image/svg+xml;

upstream ops_app {
    server 127.0.0.1:44537;
    keepalive 32;
}

server {
    listen 80;
    server_name ops-api.88813888.xyz;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://ops-api.88813888.xyz$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name ops-api.88813888.xyz;

    ssl_certificate     /etc/letsencrypt/live/ops-api.88813888.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ops-api.88813888.xyz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=300" always;

    client_max_body_size 32m;

    location = /api/v1/desktop/channel {
        proxy_pass http://ops_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://ops_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_set_header Accept-Encoding "";
        proxy_buffering on;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
