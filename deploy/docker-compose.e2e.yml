# 仅用于本地生产镜像验收，必须配合 -p ops-prod-e2e；测试值不用于部署。
name: ops-prod-e2e
services:
  app:
    image: ${OPS_E2E_IMAGE:-ops-app:prod-e2e}
    env_file: !reset []
    environment:
      OPS_MASTER_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      OPS_DATABASE_URL: postgres://ops:local_e2e_password@postgres:5432/ops?sslmode=disable
      OPS_PUBLIC_IP: 127.0.0.1
      OPS_COOKIE_SECURE: "0"
      OPS_WECHAT_BASE: http://mock:8191
      OPS_CRAWL_MODE: "off"
    ports: !override ["127.0.0.1:44538:8080"]
  postgres:
    environment:
      POSTGRES_PASSWORD: local_e2e_password
  mock:
    image: ${OPS_E2E_IMAGE:-ops-app:prod-e2e}
    environment:
      OPS_DEV: "1"
      OPS_LISTEN: ":8181"
      OPS_MOCK_LISTEN: ":8191"
      OPS_MASTER_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      OPS_DATABASE_URL: postgres://ops:local_e2e_password@postgres:5432/ops?sslmode=disable
      OPS_CRAWL_MODE: "off"
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8191/robots.txt"]
      interval: 2s
      timeout: 3s
      retries: 20
