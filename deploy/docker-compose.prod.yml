name: ops

# 生产默认由宿主机 Nginx 反代；不占用 80/443，避免与原有站点冲突。
services:
  app:
    image: ${OPS_IMAGE:-ops-app:local}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    env_file:
      - .env
    environment:
      OPS_DEV: "0"
      OPS_LISTEN: ":8080"
      OPS_STATIC_DIR: /app/static
      OPS_DATA_DIR: /data
      OPS_PUBLIC_IP: ${OPS_PUBLIC_IP}
      OPS_MASTER_KEY: ${OPS_MASTER_KEY}
      # 当前为 HTTP 反代；上 HTTPS 后改为 1 或删掉此行
      OPS_COOKIE_SECURE: ${OPS_COOKIE_SECURE:-0}
      # 跨源前端白名单（D-153）：留空 = 只允许同源（本地开发、后端自托管页面、桌面端）。
      # Cloudflare Pages 上的 web 前端上线后，在这里填它的来源，例如 https://web.88813888.xyz
      OPS_CORS_ORIGINS: ${OPS_CORS_ORIGINS:-}
      # 前端与 API 同属 88813888.xyz 时保持 lax 即可；换成别的站点才需要 none
      OPS_COOKIE_SAMESITE: ${OPS_COOKIE_SAMESITE:-lax}
      OPS_AI_WORKERS: ${OPS_AI_WORKERS:-3}
      OPS_DB_MAX_CONNS: ${OPS_DB_MAX_CONNS:-20}
      OPS_DATABASE_URL: postgres://ops:${POSTGRES_PASSWORD}@postgres:5432/ops?sslmode=disable
    ports:
      # 宿主机映射端口可改；容器内仍监听 8080
      - "127.0.0.1:44537:8080"
    volumes:
      - app_data:/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 3s
      start_period: 30s
      retries: 5

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      POSTGRES_USER: ops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ops
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ops -d ops"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pg_data:
  app_data:
