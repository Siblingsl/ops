name: ops

# 生产默认由宿主机 Nginx 反代；不占用 80/443，避免与原有站点冲突。
services:
  app:
    image: ${OPS_IMAGE:-ops-app:local}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    env_file:
      - .env
    environment:
      OPS_DEV: "0"
      OPS_LISTEN: ":8080"
      OPS_DATA_DIR: /data
      OPS_PUBLIC_IP: ${OPS_PUBLIC_IP}
      OPS_MASTER_KEY: ${OPS_MASTER_KEY}
      # 桌面包通过 HTTPS API 访问，Secure Cookie 必须开启
      OPS_COOKIE_SECURE: ${OPS_COOKIE_SECURE:-1}
      # 只允许 Electron 桌面 UI 的本地安全协议来源
      OPS_CORS_ORIGINS: ${OPS_CORS_ORIGINS:-ops-desktop://business}
      # 桌面本地 UI 跨站请求 API，需要 None + Secure Cookie
      OPS_COOKIE_SAMESITE: ${OPS_COOKIE_SAMESITE:-none}
      # env_file 可能仍含旧的静态前端路径，生产容器明确禁用静态 Web 服务
      OPS_STATIC_DIR: ""
      OPS_AI_WORKERS: ${OPS_AI_WORKERS:-3}
      OPS_DB_MAX_CONNS: ${OPS_DB_MAX_CONNS:-20}
      OPS_DATABASE_URL: postgres://ops:${POSTGRES_PASSWORD}@postgres:5432/ops?sslmode=disable
      OPS_DOCUMENT_PARSER_SOCKETS: /run/ops-parser-a/parser.sock,/run/ops-parser-b/parser.sock
    ports:
      # 宿主机映射端口可改；容器内仍监听 8080
      - "127.0.0.1:44537:8080"
    volumes:
      - app_data:/data
      - parser_a_socket:/run/ops-parser-a
      - parser_b_socket:/run/ops-parser-b
    depends_on:
      postgres:
        condition: service_healthy
      parser_a:
        condition: service_healthy
      parser_b:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 3s
      start_period: 30s
      retries: 5

  parser_a:
    image: ${OPS_IMAGE:-ops-app:local}
    command: ["/app/ops", "parse-service"]
    restart: unless-stopped
    network_mode: none
    read_only: true
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 0.5
    pids_limit: 32
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=4m
    environment:
      GOMEMLIMIT: "192MiB"
      OPS_DOCUMENT_PARSER_SOCKET: /run/ops-parser/parser.sock
    volumes:
      - parser_a_socket:/run/ops-parser
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--unix-socket", "/run/ops-parser/parser.sock", "http://localhost/healthz"]
      interval: 5s
      timeout: 2s
      start_period: 5s
      retries: 10

  parser_b:
    image: ${OPS_IMAGE:-ops-app:local}
    command: ["/app/ops", "parse-service"]
    restart: unless-stopped
    network_mode: none
    read_only: true
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 0.5
    pids_limit: 32
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=4m
    environment:
      GOMEMLIMIT: "192MiB"
      OPS_DOCUMENT_PARSER_SOCKET: /run/ops-parser/parser.sock
    volumes:
      - parser_b_socket:/run/ops-parser
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--unix-socket", "/run/ops-parser/parser.sock", "http://localhost/healthz"]
      interval: 5s
      timeout: 2s
      start_period: 5s
      retries: 10

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      POSTGRES_USER: ops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ops
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ops -d ops"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pg_data:
  app_data:
  parser_a_socket:
  parser_b_socket:
