name: ops-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ops
      POSTGRES_PASSWORD: ops_dev_password
      POSTGRES_DB: ops
    ports:
      - "5440:5432"
    volumes:
      - ops-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ops -d ops"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  ops-pg-data:
