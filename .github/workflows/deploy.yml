name: Deploy

on:
  push:
    branches: [main]
    # 纯文档改动不重建生产：部署要备份数据库并重启 app/parser 容器，对只改文档的
    # 提交是纯浪费。paths-ignore 只在「本次改动的文件全部命中」时跳过；同时改了代码、
    # 部署脚本或工作流，仍会正常部署。
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:
    inputs:
      action:
        description: '部署、开启桌面 AI、只读访问诊断或免构建恢复容器'
        type: choice
        options: [deploy, diagnose, enable-desktop-ai, recover]
        default: deploy

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && inputs.action == 'diagnose' && 'diagnose-production' || 'deploy-production' }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'workflow_dispatch' &&
        (inputs.action == 'diagnose' || inputs.action == 'recover' || github.ref == 'refs/heads/main')) ||
      (github.event_name == 'push' && vars.OPS_PRODUCTION_DEPLOY_ENABLED == 'true')
    steps:
      # 生产镜像主要由 server 构建；桌面/Web e2e 仍在 CI 跑，但不挡上线（方案 1）。
      - name: Wait for CI server job on this commit
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.action == 'deploy')
        env:
          GH_TOKEN: ${{ github.token }}
          CI_SHA: ${{ github.sha }}
        timeout-minutes: 50
        run: |
          set -euo pipefail
          for attempt in $(seq 1 180); do
            run_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${CI_SHA}&per_page=100" \
              --jq '[.workflow_runs[] | select(.head_sha == env.CI_SHA and .name == "CI")] | sort_by(.updated_at) | last | .id // empty')"
            if [[ -z "$run_id" ]]; then
              sleep 15
              continue
            fi
            state="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100" \
              --jq '[.jobs[] | select(.name == "server")] | first | if . == null then "missing" else [.status, (.conclusion // "")] | @tsv end')"
            case "$state" in
              $'completed\tsuccess')
                echo "CI server job passed for ${CI_SHA} (run ${run_id})."
                exit 0
                ;;
              $'completed\t'*)
                echo "::error::CI server job for ${CI_SHA} completed with: ${state#*$'\t'}; deployment stopped."
                exit 1
                ;;
              missing)
                # CI 已起但 server job 尚未入列时继续等
                ;;
            esac
            sleep 15
          done
          echo "::error::Timed out waiting for CI server job for ${CI_SHA}; deployment stopped."
          exit 1

      - name: Prepare SSH key
        id: prep
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_KEY_B64: ${{ secrets.DEPLOY_SSH_KEY_B64 }}
        run: |
          set -euo pipefail
          if [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_USER" ] || [ -z "$DEPLOY_PATH" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Deploy host/user/path secrets incomplete; skip."
            exit 0
          fi
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          KEY_FILE="$HOME/.ssh/ops_deploy"
          if [ -n "${DEPLOY_SSH_KEY_B64:-}" ]; then
            printf '%s' "$DEPLOY_SSH_KEY_B64" | tr -d '\n\r\t ' | base64 -d > "$KEY_FILE"
          elif [ -n "${DEPLOY_SSH_KEY:-}" ]; then
            printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' > "$KEY_FILE"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "No DEPLOY_SSH_KEY_B64 or DEPLOY_SSH_KEY; skip."
            exit 0
          fi
          # 去掉可能的 BOM / 多余 CR
          sed -i 's/\r$//' "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          if ! ssh-keygen -y -f "$KEY_FILE" >/dev/null 2>&1; then
            echo "::error::SSH 私钥无法解析。请用 DEPLOY_SSH_KEY_B64（base64）重新写入 Secret"
            exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "key_file=$KEY_FILE" >> "$GITHUB_OUTPUT"

      - name: Deploy over SSH
        if: steps.prep.outputs.ready == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key_path: ${{ steps.prep.outputs.key_file }}
          port: 22
          # 小 VPS 上 docker go build 可能超过 1 小时；超时后远端进程常残留并占满内存。
          command_timeout: 120m
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"
            if [[ "${{ inputs.action == 'diagnose' }}" == "true" ]]; then
              echo "=== containers ==="
              docker compose -f deploy/docker-compose.prod.yml ps
              echo "=== nginx ==="
              systemctl is-active nginx || true
              nginx -t 2>&1 || true
              echo "=== HTTP listeners ==="
              ss -ltnp '( sport = :80 or sport = :443 )'
              echo "=== proxy process ==="
              for proxy_pid in $(ss -ltnp 'sport = :80' | sed -n 's/.*pid=\([0-9]*\).*/\1/p' | head -n 1); do
                readlink "/proc/$proxy_pid/exe" || true
                readlink "/proc/$proxy_pid/cwd" || true
                tr '\0' '\n' < "/proc/$proxy_pid/cmdline" || true
              done
              echo "=== proxy containers ==="
              docker ps --format '{{.Names}} {{.Image}} {{.Ports}}' | grep -Ei 'nginx|openresty|:80->|:443->' || true
              echo "=== installed proxy ==="
              for binary in /usr/sbin/nginx /www/server/nginx/sbin/nginx /usr/local/nginx/sbin/nginx /usr/local/openresty/nginx/sbin/nginx; do
                if [[ -x "$binary" ]]; then
                  echo "$binary"
                  "$binary" -t 2>&1 || true
                fi
              done
              echo "=== documented site paths ==="
              for site in /etc/nginx/conf.d/ops-api.conf /www/server/panel/vhost/nginx/ops-api.88813888.xyz.conf /usr/local/nginx/conf/conf.d/ops-api.conf; do
                if [[ -f "$site" ]]; then
                  echo "$site"
                  awk '/^[[:space:]]*(listen|server_name|ssl_certificate|ssl_certificate_key|proxy_pass|root)[[:space:]]/ {print}' "$site"
                fi
              done
              echo "=== certificate tooling ==="
              command -v certbot || true
              if [[ -x /root/.acme.sh/acme.sh ]]; then echo "acme.sh installed"; fi
              echo "=== public certificate ==="
              if [[ -f /etc/letsencrypt/live/ops-api.88813888.xyz/fullchain.pem ]]; then
                openssl x509 -in /etc/letsencrypt/live/ops-api.88813888.xyz/fullchain.pem -noout -dates -subject -issuer
              else
                echo "No certificate at documented path."
              fi
              for endpoint in http://127.0.0.1:44537/healthz http://ops-api.88813888.xyz/healthz https://ops-api.88813888.xyz/healthz; do
                echo "=== $endpoint ==="
                curl --noproxy '*' --max-time 10 -sS -o /dev/null -w 'status=%{http_code} remote=%{remote_ip}\n' "$endpoint" || true
              done
              echo "=== local nginx HTTP ==="
              curl --noproxy '*' --max-time 10 --resolve ops-api.88813888.xyz:80:127.0.0.1 -sS -o /dev/null -w 'status=%{http_code}\n' http://ops-api.88813888.xyz/healthz || true
              echo "=== local nginx HTTPS ==="
              curl --noproxy '*' --max-time 10 --resolve ops-api.88813888.xyz:443:127.0.0.1 -sS -o /dev/null -w 'status=%{http_code}\n' https://ops-api.88813888.xyz/healthz || true
              echo "=== CORS 白名单 ==="
              # 只读：把容器里生效的 OPS_CORS_ORIGINS / OPS_COOKIE_SAMESITE 打出来
              docker compose -f deploy/docker-compose.prod.yml exec -T app sh -lc \
                'echo "OPS_CORS_ORIGINS=[${OPS_CORS_ORIGINS:-}]"; echo "OPS_COOKIE_SAMESITE=[${OPS_COOKIE_SAMESITE:-}]"; echo "OPS_COOKIE_SECURE=[${OPS_COOKIE_SECURE:-}]"; echo "OPS_STATIC_DIR=[${OPS_STATIC_DIR:-}]"' || true
              # 预检：白名单来源应 204 且带 ACAO；非白名单来源应 403 且无 ACAO
              for origin in "${OPS_CORS_PROBE_ORIGIN:-ops-desktop://business}" https://cors-probe.invalid; do
                echo "--- preflight Origin: $origin ---"
                curl --noproxy '*' --max-time 10 -sS -D - -o /dev/null -X OPTIONS \
                  -H "Origin: $origin" \
                  -H 'Access-Control-Request-Method: GET' \
                  -H 'Access-Control-Request-Headers: x-csrf-token' \
                  https://ops-api.88813888.xyz/api/v1/healthz 2>&1 | grep -Ei '^(HTTP/|access-control-|vary:)' || true
              done
              echo "--- 桌面通道不得回 CORS 头 ---"
              curl --noproxy '*' --max-time 10 -sS -D - -o /dev/null \
                https://ops-api.88813888.xyz/api/v1/desktop/channel 2>&1 | grep -Ei '^(HTTP/|access-control-)' || true
            elif [[ "${{ inputs.action == 'enable-desktop-ai' }}" == "true" ]]; then
              ENV_FILE=deploy/.env
              if [[ ! -f "$ENV_FILE" ]]; then
                echo "缺少 $ENV_FILE；拒绝修改服务器配置。" >&2
                exit 1
              fi
              BACKUP_FILE="$ENV_FILE.bak.desktop-ai-$(date -u +%Y%m%dT%H%M%SZ)-${{ github.run_id }}"
              cp -p "$ENV_FILE" "$BACKUP_FILE"
              TMP_FILE="$(mktemp "$ENV_FILE.XXXXXX")"
              awk '!/^OPS_DESKTOP_AI_ENABLED=/' "$ENV_FILE" > "$TMP_FILE"
              if [[ -s "$TMP_FILE" ]] && [[ "$(tail -c 1 "$TMP_FILE" | wc -l)" -eq 0 ]]; then
                printf '\n' >> "$TMP_FILE"
              fi
              printf 'OPS_DESKTOP_AI_ENABLED=1\n' >> "$TMP_FILE"
              chmod --reference="$ENV_FILE" "$TMP_FILE"
              mv "$TMP_FILE" "$ENV_FILE"
              if ! docker compose -f deploy/docker-compose.prod.yml config --quiet; then
                cp -p "$BACKUP_FILE" "$ENV_FILE"
                echo "生产 Compose 配置校验失败；已恢复原 .env。" >&2
                exit 1
              fi
              docker compose -f deploy/docker-compose.prod.yml up -d --no-deps --force-recreate app
              for attempt in $(seq 1 30); do
                if curl --noproxy '*' --max-time 5 --fail --silent -o /dev/null http://127.0.0.1:44537/healthz; then
                  break
                fi
                if [[ "$attempt" -eq 30 ]]; then
                  echo "API 容器重建后健康检查未通过；备份保留在 $BACKUP_FILE。" >&2
                  exit 1
                fi
                sleep 2
              done
              docker compose -f deploy/docker-compose.prod.yml exec -T app sh -ec 'test "${OPS_DESKTOP_AI_ENABLED:-}" = "1"'
              echo "桌面 AI 全局开关已启用；原配置备份于 $BACKUP_FILE。"
            elif [[ "${{ inputs.action == 'recover' }}" == "true" ]]; then
              # 免构建恢复：只把现有镜像的容器拉起来，不拉代码、不重建、不备份。
              # 用于部署在 go build 阶段被 SSH 超时打断后，app/parser 一直停着导致 nginx 502。
              if [[ ! -f deploy/docker-compose.prod.yml ]]; then
                echo "缺少 deploy/docker-compose.prod.yml；无法恢复。" >&2
                exit 1
              fi
              echo "=== 现有镜像 ==="
              docker images --format '{{.Repository}}:{{.Tag}} {{.ID}} {{.CreatedSince}}' | grep -E '^ops-app' || true
              echo "=== 启动现有镜像（--no-build） ==="
              docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env up -d --no-build --remove-orphans
              for attempt in $(seq 1 30); do
                if curl --noproxy '*' --max-time 5 --fail --silent -o /dev/null http://127.0.0.1:44537/healthz; then
                  echo "容器已恢复，回环健康检查通过（第 $attempt 次）。"
                  break
                fi
                if [[ "$attempt" -eq 30 ]]; then
                  echo "容器已启动但健康检查未通过，请查看上一步日志。" >&2
                  docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env ps >&2 || true
                  docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env logs --tail=80 app >&2 || true
                  exit 1
                fi
                sleep 2
              done
              docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env ps
              for endpoint in http://127.0.0.1:44537/healthz https://ops-api.88813888.xyz/healthz; do
                curl --noproxy '*' --max-time 10 -sS -o /dev/null -w "$endpoint -> %{http_code}\n" "$endpoint" || true
              done
            else
              DEPLOY_SHA='${{ github.sha }}'
              if [[ ! -f deploy/.env ]]; then
                echo "缺少 deploy/.env；拒绝重置服务器仓库。" >&2
                exit 1
              fi
              git fetch origin
              if ! git merge-base --is-ancestor "$DEPLOY_SHA" origin/main; then
                echo "提交 $DEPLOY_SHA 不是 origin/main 的祖先；拒绝部署。" >&2
                exit 1
              fi
              git reset --hard "$DEPLOY_SHA"
              bash deploy/update.sh "$DEPLOY_SHA"
            fi
