name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      action:
        description: '部署或只读访问诊断'
        type: choice
        options: [deploy, diagnose]
        default: deploy

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && inputs.action == 'diagnose' && 'diagnose-production' || 'deploy-production' }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare SSH key
        id: prep
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_KEY_B64: ${{ secrets.DEPLOY_SSH_KEY_B64 }}
        run: |
          set -euo pipefail
          if [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_USER" ] || [ -z "$DEPLOY_PATH" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Deploy host/user/path secrets incomplete; skip."
            exit 0
          fi
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          KEY_FILE="$HOME/.ssh/ops_deploy"
          if [ -n "${DEPLOY_SSH_KEY_B64:-}" ]; then
            printf '%s' "$DEPLOY_SSH_KEY_B64" | tr -d '\n\r\t ' | base64 -d > "$KEY_FILE"
          elif [ -n "${DEPLOY_SSH_KEY:-}" ]; then
            printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' > "$KEY_FILE"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "No DEPLOY_SSH_KEY_B64 or DEPLOY_SSH_KEY; skip."
            exit 0
          fi
          # 去掉可能的 BOM / 多余 CR
          sed -i 's/\r$//' "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          if ! ssh-keygen -y -f "$KEY_FILE" >/dev/null 2>&1; then
            echo "::error::SSH 私钥无法解析。请用 DEPLOY_SSH_KEY_B64（base64）重新写入 Secret"
            exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "key_file=$KEY_FILE" >> "$GITHUB_OUTPUT"

      - name: Deploy over SSH
        if: steps.prep.outputs.ready == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key_path: ${{ steps.prep.outputs.key_file }}
          port: 22
          command_timeout: 60m
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"
            if [[ "${{ inputs.action == 'diagnose' }}" == "true" ]]; then
              echo "=== containers ==="
              docker compose -f deploy/docker-compose.prod.yml ps
              echo "=== nginx ==="
              systemctl is-active nginx || true
              nginx -t 2>&1 || true
              echo "=== HTTP listeners ==="
              ss -ltnp '( sport = :80 or sport = :443 )'
              echo "=== installed proxy ==="
              for binary in /usr/sbin/nginx /www/server/nginx/sbin/nginx /usr/local/nginx/sbin/nginx; do
                if [[ -x "$binary" ]]; then
                  echo "$binary"
                  "$binary" -t 2>&1 || true
                fi
              done
              echo "=== documented site paths ==="
              for site in /etc/nginx/conf.d/ops.conf /www/server/panel/vhost/nginx/ops.88813888.xyz.conf /usr/local/nginx/conf/conf.d/ops.conf; do
                if [[ -f "$site" ]]; then
                  echo "$site"
                  awk '/^[[:space:]]*(listen|server_name|ssl_certificate|ssl_certificate_key|proxy_pass|root)[[:space:]]/ {print}' "$site"
                fi
              done
              echo "=== certificate tooling ==="
              command -v certbot || true
              if [[ -x /root/.acme.sh/acme.sh ]]; then echo "acme.sh installed"; fi
              echo "=== public certificate ==="
              if [[ -f /etc/letsencrypt/live/ops.88813888.xyz/fullchain.pem ]]; then
                openssl x509 -in /etc/letsencrypt/live/ops.88813888.xyz/fullchain.pem -noout -dates -subject -issuer
              else
                echo "No certificate at documented path."
              fi
              for endpoint in http://127.0.0.1:44537/healthz http://ops.88813888.xyz/healthz https://ops.88813888.xyz/healthz; do
                echo "=== $endpoint ==="
                curl --noproxy '*' --max-time 10 -sS -o /dev/null -w 'status=%{http_code} remote=%{remote_ip}\n' "$endpoint" || true
              done
              echo "=== local nginx HTTP ==="
              curl --noproxy '*' --max-time 10 --resolve ops.88813888.xyz:80:127.0.0.1 -sS -o /dev/null -w 'status=%{http_code}\n' http://ops.88813888.xyz/healthz || true
              echo "=== local nginx HTTPS ==="
              curl --noproxy '*' --max-time 10 --resolve ops.88813888.xyz:443:127.0.0.1 -sS -o /dev/null -w 'status=%{http_code}\n' https://ops.88813888.xyz/healthz || true
            else
              bash deploy/update.sh
            fi
