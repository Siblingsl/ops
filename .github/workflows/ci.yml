name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ops
          POSTGRES_PASSWORD: ops_ci
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ops -d postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Start bounded document parser workers
        run: |
          set -euo pipefail
          image_dir="$RUNNER_TEMP/ops-parser-image"
          mkdir -p "$image_dir"
          CGO_ENABLED=0 go build -trimpath -o "$image_dir/ops" ./cmd/ops
          printf 'FROM scratch\nCOPY ops /app/ops\nENTRYPOINT ["/app/ops", "parse-service"]\n' > "$image_dir/Dockerfile"
          docker build --tag ops-parser:ci "$image_dir"
          for lane in server-a server-b; do
            socket_dir="$RUNNER_TEMP/ops-parser-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${lane}"
            container_name="ops-parser-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${lane}"
            mkdir -p "$socket_dir"
            docker run --detach \
              --name "$container_name" \
              --network none --read-only --memory 256m --memory-swap 256m --cpus 0.5 \
              --pids-limit 32 --cap-drop ALL --security-opt no-new-privileges:true \
              --user "$(id -u):$(id -g)" --tmpfs /tmp:rw,noexec,nosuid,size=4m \
              --env GOMEMLIMIT=192MiB \
              --env OPS_DOCUMENT_PARSER_SOCKET=/run/ops-parser/parser.sock \
              --volume "$socket_dir:/run/ops-parser" ops-parser:ci
            for attempt in $(seq 1 30); do
              test -S "$socket_dir/parser.sock" && break
              sleep 1
            done
            if ! test -S "$socket_dir/parser.sock"; then
              docker logs "$container_name"
              exit 1
            fi
            limits=$(docker inspect --format '{{.HostConfig.Memory}} {{.HostConfig.MemorySwap}} {{.HostConfig.NetworkMode}} {{.HostConfig.ReadonlyRootfs}}' "$container_name")
            test "$limits" = "268435456 268435456 none true"
            docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' "$container_name" | grep -qx 'GOMEMLIMIT=192MiB'
          done
          echo "OPS_DOCUMENT_PARSER_SOCKETS=$RUNNER_TEMP/ops-parser-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-server-a/parser.sock,$RUNNER_TEMP/ops-parser-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-server-b/parser.sock" >> "$GITHUB_ENV"
      - name: Test
        env:
          OPS_TEST_ADMIN_URL: postgres://ops:ops_ci@localhost:5432/postgres?sslmode=disable
        # OPT-02 validates p95 degradation; parallel package load makes its 20% threshold nondeterministic.
        run: go test -p 1 ./...
      - name: Stop bounded document parser workers
        if: always()
        run: |
          docker rm --force \
            "ops-parser-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-server-a" \
            "ops-parser-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-server-b" || true

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run build
      # D-153：前端要能部署到 Cloudflare Pages（跨源），确认 OPS_API_BASE 真的被注入到产物里。
      # 默认构建（上一行）保持相对路径，服务端自托管与桌面端不受影响。
      - name: Build (cross-origin)
        env:
          OPS_API_BASE: https://ops.example.invalid
        run: |
          pnpm exec vite build --outDir dist-crossorigin
          # apiUrl() 运行时拼接 `${base}/api/v1${path}`，产物里只需出现 base 本身
          grep -rlq 'ops\.example\.invalid' dist-crossorigin \
            || { echo "::error::OPS_API_BASE 没有被注入构建产物，检查 vite.config.ts 的 define"; exit 1; }

  e2e:
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ops
          POSTGRES_PASSWORD: ops_ci
          POSTGRES_DB: ops
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ops -d ops"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: web
    env:
      OPS_E2E_ADMIN_URL: postgres://ops:ops_ci@127.0.0.1:5432/ops?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Start bounded document parser workers
        working-directory: server
        run: |
          set -euo pipefail
          image_dir="$RUNNER_TEMP/ops-parser-image"
          mkdir -p "$image_dir"
          CGO_ENABLED=0 go build -trimpath -o "$image_dir/ops" ./cmd/ops
          printf 'FROM scratch\nCOPY ops /app/ops\nENTRYPOINT ["/app/ops", "parse-service"]\n' > "$image_dir/Dockerfile"
          docker build --tag ops-parser:ci "$image_dir"
          for lane in a b; do
            socket_dir="$RUNNER_TEMP/ops-parser-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-e2e-${{ matrix.shard }}-${lane}"
            container_name="ops-parser-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-e2e-${{ matrix.shard }}-${lane}"
            mkdir -p "$socket_dir"
            docker run --detach \
              --name "$container_name" \
              --network none --read-only --memory 256m --memory-swap 256m --cpus 0.5 \
              --pids-limit 32 --cap-drop ALL --security-opt no-new-privileges:true \
              --user "$(id -u):$(id -g)" --tmpfs /tmp:rw,noexec,nosuid,size=4m \
              --env GOMEMLIMIT=192MiB \
              --env OPS_DOCUMENT_PARSER_SOCKET=/run/ops-parser/parser.sock \
              --volume "$socket_dir:/run/ops-parser" ops-parser:ci
            for attempt in $(seq 1 30); do
              test -S "$socket_dir/parser.sock" && break
              sleep 1
            done
            if ! test -S "$socket_dir/parser.sock"; then
              docker logs "$container_name"
              exit 1
            fi
            limits=$(docker inspect --format '{{.HostConfig.Memory}} {{.HostConfig.MemorySwap}} {{.HostConfig.NetworkMode}} {{.HostConfig.ReadonlyRootfs}}' "$container_name")
            test "$limits" = "268435456 268435456 none true"
            docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' "$container_name" | grep -qx 'GOMEMLIMIT=192MiB'
          done
          echo "OPS_DOCUMENT_PARSER_SOCKETS=$RUNNER_TEMP/ops-parser-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-e2e-${{ matrix.shard }}-a/parser.sock,$RUNNER_TEMP/ops-parser-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-e2e-${{ matrix.shard }}-b/parser.sock" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Playwright
        run: pnpm exec playwright test --shard=${{ matrix.shard }}/3
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-failure-${{ matrix.shard }}
          path: |
            web/test-results/
            web/playwright-report/
      - name: Stop bounded document parser workers
        if: always()
        run: |
          docker rm --force \
            "ops-parser-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-e2e-${{ matrix.shard }}-a" \
            "ops-parser-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-e2e-${{ matrix.shard }}-b" || true
