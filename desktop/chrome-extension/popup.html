<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>OPS Browser Bridge</title>
  <style>
    body { font-family: system-ui, sans-serif; width: 260px; margin: 0; padding: 12px; font-size: 13px; color: #1f2937; }
    h1 { font-size: 14px; margin: 0 0 8px; }
    .row { display: flex; justify-content: space-between; margin: 4px 0; }
    .label { color: #6b7280; }
    .code { font-size: 22px; letter-spacing: 6px; font-weight: 600; color: #6d28d9; text-align: center; margin: 10px 0; font-variant-numeric: tabular-nums; }
    .hint { color: #6b7280; font-size: 12px; line-height: 1.5; }
    .ok { color: #16a34a; } .bad { color: #dc2626; }
    ul { margin: 4px 0 0; padding-left: 16px; max-height: 120px; overflow: auto; }
    li { margin: 2px 0; font-size: 12px; }
  </style>
</head>
<body>
  <h1>OPS Browser Bridge</h1>
  <div class="row"><span class="label">宿主</span><span id="host">…</span></div>
  <div class="row"><span class="label">配对</span><span id="paired">…</span></div>
  <div id="pairing-box" hidden>
    <div class="hint">请在 OPS 桌面端核对以下短码：</div>
    <div class="code" id="code">------</div>
  </div>
  <div class="hint" id="hint"></div>
  <div class="row" style="margin-top:8px"><span class="label">实例</span><span id="instance" style="font-size:11px"></span></div>
  <div class="label" style="margin-top:6px">最近命令</div>
  <ul id="cmds"></ul>
  <script src="popup.js"></script>
</body>
</html>
